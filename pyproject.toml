[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "labreceipt"
version = "0.1.0"
description = "Deterministic acceptance contracts and evidence receipts for agent deliverables"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [{name = "LabReceipt contributors"}]
keywords = ["ai-agents", "acceptance-testing", "evidence", "artifacts", "json-schema"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.6",
  "types-jsonschema>=4.23",
]

[project.scripts]
labreceipt = "labreceipt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["labreceipt"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["labreceipt"]
