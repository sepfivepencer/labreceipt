name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/labreceipt
      - run: pytest --cov=labreceipt --cov-report=term-missing
      - run: python -m build
      - name: Offline CLI smoke test
        run: |
          mkdir smoke
          cd smoke
          printf 'Conclusion: accepted\n' > report.txt
          labreceipt init --out candidate.json
          labreceipt confirm candidate.json --reviewed-by ci --out contract.json
          labreceipt verify contract.json --workspace . --out receipt.json
